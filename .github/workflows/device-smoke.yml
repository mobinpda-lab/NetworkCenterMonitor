name: Android Device Smoke

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: device-smoke-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  emulator-smoke:
    name: emulator-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      EVIDENCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      APP_ID: com.mobinpdalab.networkcentermonitor
      MAIN_ACTIVITY: com.mobinpdalab.networkcentermonitor/.MainActivity
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EVIDENCE_SHA }}

      - name: Verify exact checked-out SHA
        run: test "$(git rev-parse HEAD)" = "$EVIDENCE_SHA"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Generate project Gradle wrapper
        run: gradle --no-daemon wrapper --gradle-version 9.5.0

      - name: Build exact-head debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install, launch and verify app
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            mkdir -p build/device-smoke
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am force-stop "$APP_ID"
            adb shell am start -W -n "$MAIN_ACTIVITY" | tee build/device-smoke/activity-start.txt
            grep -q 'Status: ok' build/device-smoke/activity-start.txt
            sleep 3
            adb shell pidof "$APP_ID" | tee build/device-smoke/pid.txt
            test -s build/device-smoke/pid.txt
            adb exec-out screencap -p > build/device-smoke/screenshot.png
            adb logcat -d > build/device-smoke/logcat.txt

      - name: Upload device smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: device-smoke-${{ env.EVIDENCE_SHA }}
          path: build/device-smoke/**
          if-no-files-found: error
