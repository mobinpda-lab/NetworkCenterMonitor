name: NCM Autonomous Code Worker

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: GitHub Issue number to implement
        required: true
        type: string
      expected_main_sha:
        description: Exact main SHA leased by the queue
        required: true
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write

concurrency:
  group: ncm-code-worker-${{ inputs.issue_number }}
  cancel-in-progress: false

env:
  CONTROL_PLANE_ISSUE: '84'

jobs:
  code-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ISSUE_NUMBER: ${{ inputs.issue_number }}
      EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.6' }}
      ASF_MAX_FIX_ATTEMPTS: '3'
      ASF_PROVIDER_TIMEOUT_SECONDS: '180'
      ASF_PROVIDER_BUDGET_SECONDS: '540'
      ASF_LEASE_SECONDS: '1800'
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Register worker start
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue = Number(process.env.ISSUE_NUMBER);
            const control = Number(process.env.CONTROL_PLANE_ISSUE);
            const record = { schema_version: 1, event: 'WORKER_STARTED', ts: new Date().toISOString(), actor: `ncm-worker-${issue}`, issue, run_id: context.runId, expected_main_sha: process.env.EXPECTED_MAIN_SHA };
            await github.rest.issues.createComment({ owner, repo, issue_number: control, body: `<!-- asf-event WORKER_STARTED -->\n\`\`\`json\n${JSON.stringify(record)}\n\`\`\`` });
            await github.rest.issues.createComment({ owner, repo, issue_number: issue, body: `<!-- ncm-worker-start -->\nWorker run ${context.runId} started; exact-main=${process.env.EXPECTED_MAIN_SHA}.` });

      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate exact main lease
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test -n "$EXPECTED_MAIN_SHA"
          test "$actual" = "$EXPECTED_MAIN_SHA"

      - name: Select issue-scoped worker branch
        run: |
          set -euo pipefail
          branch="ai/issue-${ISSUE_NUMBER}"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            git fetch origin "$branch"
            git switch -C "$branch" "origin/$branch"
            git merge-base --is-ancestor "origin/main" HEAD || { echo 'Worker branch is stale against current main; fail closed.'; exit 8; }
          else
            git switch -c "$branch"
          fi
          echo "WORKER_BRANCH=$branch" >> "$GITHUB_ENV"

      - name: Generate, test and self-fix
        env:
          NCM_ISSUE_NUMBER: ${{ inputs.issue_number }}
          NCM_EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
        run: python3 .github/asf/agent-runtime.py

      - name: Commit worker result
        run: |
          set -euo pipefail
          git diff --quiet && { echo 'Worker produced no change.'; exit 1; }
          git add -A
          git commit -m "feat(ai-worker): implement issue #${ISSUE_NUMBER}"

      - name: Push issue branch
        run: git push origin "HEAD:${WORKER_BRANCH}"

      - name: Create or reuse guarded draft PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          existing="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$WORKER_BRANCH" --base main --state open --json number --jq '.[0].number')"
          if [ -n "$existing" ]; then pr="$existing"; else pr_url="$(gh pr create --repo "$GITHUB_REPOSITORY" --draft --head "$WORKER_BRANCH" --base main --title "AI Worker: issue #${ISSUE_NUMBER}" --body "Bounded autonomous Code Worker result for #${ISSUE_NUMBER}. Exact-head CI, Device Smoke and Security gates remain required.")"; pr="${pr_url##*/}"; fi
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "<!-- ncm-worker-output -->\nCode Worker produced/updated PR #${pr} from exact leased main ${EXPECTED_MAIN_SHA}."
          echo "PR_NUMBER=$pr" >> "$GITHUB_ENV"

      - name: Wake canonical promotion gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run production-orchestrator.yml --repo "$GITHUB_REPOSITORY" --ref main -f pr_number="$PR_NUMBER"

      - name: Publish worker completion and release lease
        if: always()
        uses: actions/github-script@v7
        env:
          WORKER_STATUS: ${{ job.status }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue = Number(process.env.ISSUE_NUMBER);
            const control = Number(process.env.CONTROL_PLANE_ISSUE);
            const status = process.env.WORKER_STATUS;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: issue, per_page: 100 });
            const failures = comments.filter(c => String(c.body || '').includes('<!-- ncm-worker-start -->')).length;
            const record = { schema_version: 1, event: status === 'success' ? 'WORKER_COMPLETED' : 'WORKER_FAILED', ts: new Date().toISOString(), actor: `ncm-worker-${issue}`, issue, run_id: context.runId, status, expected_main_sha: process.env.EXPECTED_MAIN_SHA, attempt: failures };
            await github.rest.issues.createComment({ owner, repo, issue_number: control, body: `<!-- asf-event ${record.event} -->\n\`\`\`json\n${JSON.stringify(record)}\n\`\`\`` });
            if (status === 'success') {
              await github.rest.issues.removeLabel({ owner, repo, issue_number: issue, name: 'factory:leased' }).catch(() => {});
              await github.rest.issues.removeLabel({ owner, repo, issue_number: issue, name: 'factory:in-progress' }).catch(() => {});
              await github.rest.issues.createComment({ owner, repo, issue_number: issue, body: `<!-- ncm-worker-complete -->\nWorker completed successfully in run ${context.runId}; lease released after guarded PR handoff.` });
            } else if (failures < 3) {
              await github.rest.issues.removeLabel({ owner, repo, issue_number: issue, name: 'factory:leased' }).catch(() => {});
              await github.rest.issues.removeLabel({ owner, repo, issue_number: issue, name: 'factory:in-progress' }).catch(() => {});
              await github.rest.issues.addLabels({ owner, repo, issue_number: issue, labels: ['factory:retry'] });
              await github.rest.issues.createComment({ owner, repo, issue_number: issue, body: `<!-- ncm-worker-retry -->\nWorker failed in run ${context.runId}; bounded retry ${failures}/3 returned task to queue.` });
            } else {
              await github.rest.issues.removeLabel({ owner, repo, issue_number: issue, name: 'factory:leased' }).catch(() => {});
              await github.rest.issues.removeLabel({ owner, repo, issue_number: issue, name: 'factory:in-progress' }).catch(() => {});
              await github.rest.issues.addLabels({ owner, repo, issue_number: issue, labels: ['factory:escalated'] }).catch(() => {});
              await github.rest.issues.createComment({ owner, repo, issue_number: issue, body: `<!-- ncm-worker-escalated -->\nWorker exhausted bounded recovery attempts; fail-closed escalation.` });
            }
