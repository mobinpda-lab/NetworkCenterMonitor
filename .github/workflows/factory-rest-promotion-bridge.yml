name: Factory REST Promotion Bridge

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  workflow_run:
    workflows: ['Android CI', 'Android Device Smoke', 'Android Security']
    types: [completed]

permissions:
  contents: read
  pull-requests: write
  actions: read

concurrency:
  group: factory-rest-promotion-bridge
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const pulls = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: 'open', base: 'main', per_page: 100,
            });
            for (const pr of pulls) {
              if (!pr.draft) continue;
              const optedIn = (pr.labels || []).some(l => l.name === 'ncm-auto') || String(pr.body || '').includes('NCM-AUTO: TRUE');
              if (!optedIn) continue;
              const head = pr.head.sha;
              const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
                owner, repo, head_sha: head, per_page: 100,
              });
              const names = ['Android CI', 'Android Device Smoke', 'Android Security'];
              const green = names.every(name => {
                const r = runs.filter(x => x.name === name && x.status === 'completed').sort((a,b) => b.id-a.id)[0];
                return r && r.conclusion === 'success';
              });
              if (!green) continue;
              const main = (await github.rest.repos.getBranch({owner,repo,branch:'main'})).data.commit.sha;
              const cmp = await github.rest.repos.compareCommitsWithBasehead({owner,repo,basehead:`${main}...${head}`});
              if (cmp.data.merge_base_commit?.sha !== main) continue;
              await github.request('PATCH /repos/{owner}/{repo}/pulls/{pull_number}', {
                owner, repo, pull_number: pr.number, draft: false,
              });
              core.notice(`#${pr.number}: promoted Draft -> Ready using REST after exact-head Android gates.`);
              return;
            }
            core.info('No eligible Draft ncm-auto PR requires REST promotion.');
