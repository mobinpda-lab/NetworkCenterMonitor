name: Sync Vazirharf Font

on:
  push:
    branches:
      - feature/vazirharf-standard
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-vazirharf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Vazirharf v34.002
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/res/font
          base="https://raw.githubusercontent.com/nadalaba/vazirharf/v34.002/fonts/ttf"
          curl -fL "$base/Vazirharf-Regular.ttf" -o app/src/main/res/font/vazirharf_regular.ttf
          curl -fL "$base/Vazirharf-Medium.ttf" -o app/src/main/res/font/vazirharf_medium.ttf
          curl -fL "$base/Vazirharf-Bold.ttf" -o app/src/main/res/font/vazirharf_bold.ttf
          test -s app/src/main/res/font/vazirharf_regular.ttf
          test -s app/src/main/res/font/vazirharf_medium.ttf
          test -s app/src/main/res/font/vazirharf_bold.ttf

      - name: Commit font assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin feature/vazirharf-standard
          git rebase origin/feature/vazirharf-standard
          git add app/src/main/res/font/vazirharf_*.ttf
          if git diff --cached --quiet; then
            echo "Vazirharf assets already synchronized."
            exit 0
          fi
          git commit -m "chore(font): sync Vazirharf v34.002 [skip ci]"
          git push origin HEAD:feature/vazirharf-standard
