name: ASF Watchdog

on:
  pull_request:
    paths:
      - '.github/workflows/asf-orchestrator.yml'
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: read
  actions: write
  issues: write

concurrency:
  group: ncm-asf-watchdog
  cancel-in-progress: false

jobs:
  watchdog:
    name: canonical-production-watchdog
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate canonical automation documents
        run: |
          test -f docs/PROJECT_STATE.md || echo 'PROJECT_STATE.md missing'
          test -f docs/ROADMAP_QUEUE.md || echo 'ROADMAP_QUEUE.md missing'
          test -f docs/MASTER_SPEC_V1.md || echo 'MASTER_SPEC_V1.md missing'

      - name: Check and wake canonical Production Orchestrator
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const workflowId = 'production-orchestrator.yml';
            const now = Date.now();

            const main = await github.rest.repos.getBranch({ owner, repo, branch: 'main' });
            const mainSha = main.data.commit.sha;
            core.info(`Current main: ${mainSha}`);

            const runs = await github.paginate(
              github.rest.actions.listWorkflowRunsForRepo,
              { owner, repo, workflow_id: workflowId, per_page: 50 },
            );

            const sameHead = runs
              .filter(run => run.head_sha === mainSha)
              .sort((a, b) => b.id - a.id);
            const active = sameHead.find(run => ['queued', 'in_progress', 'waiting', 'requested', 'pending'].includes(run.status));
            const recentSuccess = sameHead.find(run =>
              run.status === 'completed' &&
              run.conclusion === 'success' &&
              now - Date.parse(run.updated_at) <= 15 * 60 * 1000
            );

            if (active) {
              core.info(`Canonical Production Orchestrator already active: ${active.id}; no duplicate wakeup.`);
              return;
            }

            if (recentSuccess) {
              core.info(`Canonical Production Orchestrator is healthy: ${recentSuccess.id}; no wakeup required.`);
              return;
            }

            core.warning(`No recent successful Production Orchestrator run for main ${mainSha}. Waking canonical controller.`);
            await github.rest.actions.createWorkflowDispatch({
              owner,
              repo,
              workflow_id: workflowId,
              ref: 'main',
            });
            core.notice(`Production Orchestrator dispatched for main ${mainSha}.`);

      - name: Record watchdog result
        run: |
          mkdir -p evidence
          printf 'ASF Watchdog executed at %s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > evidence/latest-watchdog.txt
          printf 'Canonical controller: .github/workflows/production-orchestrator.yml\n' >> evidence/latest-watchdog.txt
          printf 'Policy: watchdog never merges, never bypasses gates, and never creates a second promotion controller.\n' >> evidence/latest-watchdog.txt
